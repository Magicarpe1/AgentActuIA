name: weekly-digest

on:
  schedule:
    # lundi 05:00 UTC = 6 h à Paris l'hiver, 7 h l'été
    - cron: "0 5 * * 1"
  workflow_dispatch: # bouton "Run workflow" pour tester à la demande

permissions:
  contents: write # committer le digest + la page

concurrency: digest

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || npm install

      - run: npm install -g @anthropic-ai/claude-code

      # Même chaîne que run.sh : collecte -> rédaction par Claude Code (abonnement, pas de clé API) -> page
      - name: Collecte
        run: node src/run-collect.js

      - name: Redaction
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          DATE="$(date -u +%F)"
          claude -p "La date du jour est $DATE. Lis items.json et genere le digest de la semaine en suivant CLAUDE.md. Ecris digests/$DATE.md et digests/.latest.json." \
            --allowedTools "Read,Write" --permission-mode acceptEdits
          test -s "digests/$DATE.md" && test -s digests/.latest.json

      - name: Page
        run: DIGEST_DATE="$(date -u +%F)" node src/run-render.js

      # Pages sert le dossier docs/ de main
      - name: Commit & push
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add digests/ docs/
          git commit -m "digest: $(date -u +%F)" || echo "rien à committer"
          git push

      - name: Attendre la publication Pages
        run: sleep 90

      - name: WhatsApp
        env:
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
        run: |
          printf '%s' "$RECIPIENTS_JSON" > recipients.json
          node src/notify.js
